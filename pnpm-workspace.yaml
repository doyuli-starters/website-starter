minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici@6.20.1

peerDependencyRules:
  allowedVersions:
    '@nestjs/common': '12'
    ioredis: '6'

shellEmulator: true

packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - simple-git-hooks
  - esbuild
  - vue-demi

